name: code-quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  code-qa:
    runs-on: ubuntu-latest
    steps:
    - name: Install freetype
      run: |
        sudo apt-get update
        sudo apt-get install libfreetype-dev
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
    - uses: pre-commit/action@v3.0.1
